<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f3">
  <meta name="description" content="Build with us at Ansatz Labs. Explore careers and get in touch.">
  <title>Careers — Ansatz Labs</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #f7f6f3; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      color: #20201e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .container { width: min(100% - 160px, 920px); margin-inline: auto; }
    header { padding-top: 48px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { text-decoration: none; }
    nav a { font-size: 18px; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    .prose p + p { margin-top: 28px; }
    .apply { padding-top: 48px; }
    .apply p { margin: 0; max-width: 960px; font: 400 clamp(20px, 1.7vw, 24px)/1.4 Georgia, "Times New Roman", serif; }
    .apply a { font: inherit; overflow-wrap: anywhere; }
    h1 { margin: 0; font-size: 36px; line-height: 1.3; font-weight: 400; letter-spacing: 0.14em; }
    main { flex: 1; padding-top: clamp(120px, 20vh, 260px); padding-bottom: 120px; }
    section { display: grid; grid-template-columns: 21.5% 1fr; gap: 0; }
    h2 { margin: 10px 24px 0 0; font: 400 14px/1.5 ui-monospace, "SFMono-Regular", Consolas, monospace; text-transform: uppercase; letter-spacing: 0.08em; color: #79756f; }
    .number { color: #386b8a; margin-right: 10px; }
    .about { padding-bottom: 72px; border-bottom: 1px solid #d6d3cd; }
    .about p { max-width: 960px; margin: 0; font: 400 clamp(20px, 1.7vw, 24px)/1.4 Georgia, "Times New Roman", serif; letter-spacing: -0.015em; }
    .contact { padding-top: 48px; }
    .contact h2 { margin-top: 3px; }
    a { width: fit-content; color: inherit; font-size: 18px; line-height: 1.5; text-decoration-color: #ccc8c0; text-underline-offset: 5px; text-decoration-thickness: 1px; }
    a:hover { text-decoration-color: #20201e; }
    a:focus-visible { outline: 2px solid #386b8a; outline-offset: 6px; }
    footer { padding-bottom: 32px; color: #79756f; font: 400 13px/1.6 ui-monospace, "SFMono-Regular", Consolas, monospace; letter-spacing: 0.035em; }
    @media (max-width: 700px) {
      .container { width: calc(100% - 48px); }
      header { padding-top: 30px; }
      h1 { font-size: 30px; }
      main { padding-top: 96px; padding-bottom: 100px; }
      section { grid-template-columns: 1fr; gap: 24px; }
      h2, .contact h2 { margin: 0; font-size: 12px; }
      .about { padding-bottom: 40px; }
      .about p, .apply p { font-size: 20px; }
      .contact { padding-top: 32px; }
      a { font-size: 18px; }
      footer { font-size: 11px; padding-bottom: 24px; }
    }
  </style>
</head>
<body>
  <header class="container"><a class="brand" href="/" aria-label="Ansatz Labs home"><h1>Ansatz Labs</h1></a><nav aria-label="Main navigation"><a href="/careers" aria-current="page">Careers</a></nav></header>
  <main class="container">
    <section class="about" aria-labelledby="careers-heading">
      <h2 id="careers-heading"><span class="number">01</span>Careers</h2>
      <div class="prose">
        <p>We’re looking for curious people who think deeply, care about the details, and take pride in building things that work.</p>
      </div>
    </section>
    <section class="apply" aria-labelledby="apply-heading">
      <h2 id="apply-heading"><span class="number">02</span>Apply</h2>
      <p>Email your resume and a short note about a problem you’ve enjoyed solving to <a href="mailto:careers@ansatzlabs.ai">careers@ansatzlabs.ai</a>.</p>
    </section>
  </main>
  <footer class="container">© 2026 Ansatz Labs, Inc.</footer>
</body>
</html>
