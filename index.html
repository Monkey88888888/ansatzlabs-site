<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Ansatz Labs — Finding superalphas">
  <title>Ansatz Labs</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #ffffff; }
    body {
      margin: 0;
      color: #000000;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 20px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(100%, 1040px);
      margin: 0 auto;
      padding: 32px 32px 80px;
    }
    h1 {
      margin: 0 0 24px;
      font-size: 30px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: -0.035em;
    }
    p { margin: 0 0 40px; font-weight: 400; color: #000000; }
    a { color: #000000; text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 5px; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 6px; }
    footer { margin-top: 72px; color: #000000; font-size: 13px; letter-spacing: 0.01em; }
    @media (max-width: 600px) {
      main { padding: 28px 24px 64px; }
      body { font-size: 18px; }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Ansatz Labs</h1>
    <p>Finding superalphas</p>
    <a href="mailto:hello@ansatzlabs.ai">hello@ansatzlabs.ai</a>
    <footer>© 2026 Ansatz Labs Inc.</footer>
  </main>
</body>
</html>
