<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ansatz Labs</title>
  <meta name="description" content="Ansatz Labs" />
  <style>
    :root {
      --bg: #05070d;
      --bg-2: #0a0f1d;
      --text: #f3f5f8;
      --muted: rgba(243, 245, 248, 0.68);
      --line: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 18%, rgba(80, 110, 255, 0.08), transparent 34%),
        linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(circle at center, black 28%, transparent 78%);
      pointer-events: none;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(1100px, 100%);
      text-align: center;
      animation: fadeUp 900ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    h1 {
      margin: 0;
      font-size: clamp(4rem, 12vw, 9rem);
      line-height: 0.92;
      font-weight: 600;
      letter-spacing: -0.075em;
      color: var(--text);
    }

    .email-link {
      display: inline-block;
      margin-top: 26px;
      color: var(--muted);
      text-decoration: none;
      font-size: clamp(1.05rem, 2vw, 1.5rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      border-bottom: 1px solid transparent;
      transition:
        color 180ms ease,
        border-color 180ms ease;
    }

    .email-link:hover {
      color: var(--text);
      border-color: var(--line);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 20px;
      }

      h1 {
        font-size: clamp(3.2rem, 18vw, 5.6rem);
        letter-spacing: -0.07em;
      }

      .email-link {
        margin-top: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Ansatz Labs</h1>
    <a href="mailto:hello@ansatzlabs.ai" class="email-link">hello@ansatzlabs.ai</a>
  </main>
</body>
</html>
